<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌎 Phân loại rác thông minh</title>

  <!-- TensorFlow + Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.ico">
</head>

<body>
  <!-- Thanh điều hướng -->
  <nav>
    <button onclick="showTab('tab1', event)" class="active">📸 Nhận diện</button>
    <button onclick="showTab('tab2', event)">🎥 Xử lý rác</button>
    <button onclick="showTab('tab3', event)">🔧 Tái chế</button>
    <button onclick="showTab('tab4', event)">🖼️ Sản phẩm xanh</button>
    <button onclick="showTab('tab5', event)">🏆 Xếp hạng</button>
  </nav>

  <!-- Tab 1: Nhận diện -->
  <div id="tab1" class="tab active">
    <h3 class="title">📸 Nhận diện rác bằng AI</h3>
    <p>Nhấn nút để bật camera và quét vật thể rác.</p>
    <button class="btn-eco" onclick="init()">🚀 Bắt đầu camera</button>
    <button class="btn btn-outline-success" onclick="switchCamera()">🔄 Đổi camera</button>
    <div id="webcam-container"></div>
    <div id="label-container" class="mt-3 fs-5 fw-bold text-success"></div>
  </div>

  <!-- Tab 2: Xử lý rác -->
  <div id="tab2" class="tab">
    <h3 class="title">🎥 Quy trình xử lý rác</h3>
    <div id="process-content"></div>
  </div>

  <!-- Tab 3: Tái chế -->
  <div id="tab3" class="tab">
    <h3 class="title">🔧 Dự án tái chế</h3>
    <div id="project-content"></div>
  </div>

  <!-- Tab 4: Sản phẩm xanh -->
  <div id="tab4" class="tab">
    <h3 class="title">🖼️ Sản phẩm tái chế</h3>
    <input type="file" id="imgUpload" accept="image/*" class="form-control w-75 mx-auto mb-3">
    <button class="btn-eco" onclick="uploadImage()">📤 Tải lên</button>
    <div id="gallery" class="gallery d-flex flex-wrap justify-content-center"></div>
  </div>

  <!-- Tab 5: Xếp hạng -->
  <div id="tab5" class="tab">
    <h3 class="title">🏆 Bảng xếp hạng</h3>
    <ul id="rank-list" class="fs-5 list-group w-75 mx-auto"></ul>
  </div>

  <!-- ==== FOOTER ==== -->
<footer class="footer-fixed">
  <div class="footer-content">
    <p>🌱 Học sinh xanh – Hành tinh xanh 🌎 | Dự án AI trong giáo dục 2025</p>
    <p>
      📧 Liên hệ: <a href="mailto:huyvlg@pg.hcmue.edu.vn">huyvlg@pg.hcmue.edu.vn</a> |
      ☎️ <a href="tel:0357017847">0357017847</a>
    </p>
  </div>
</footer>


  <!-- Scripts -->
  <script src="./js/main.js"></script>
  <script src="./js/ai.js"></script>
  <script src="./js/process.js"></script>
  <script src="./js/recycle.js"></script>
</body>
</html>
